<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoMatch Offer Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* VOICE: the existing AutoMatch price-offer PDF, rebuilt as a form
   IDEA: the A4 offer pages themselves, live beside the inputs
   PICTURE: page previews identical to the PDF the dealer receives
   COLOUR and TYPE: deep navy #04163a/#0b2a63, WhatsApp green, orange photo button; Figtree
   LAYOUT: editor column left, scaled A4 pages right; stacked on phones */
:root{color-scheme:light dark;--bg:light-dark(#eef1f6,#0e1116);--panel:light-dark(#fff,#171c24);--ink:light-dark(#121a2b,#e8ecf2);--muted:light-dark(#5a6472,#9aa5b4);--line:light-dark(#d6dce5,#2b3340);--navy:#0b2a63;--acc:light-dark(#0b2a63,#8fb0ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;padding:18px max(2vw,12px) 48px}
@media(max-width:980px){.app{grid-template-columns:minmax(0,1fr)}}
.ed{display:grid;gap:12px;align-content:start}
.top h1{font-size:28px;line-height:1.05;margin:0 0 4px}
.top p{margin:0;color:var(--muted);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.box>h2,.box summary{font-size:15px;font-weight:800;color:var(--acc);margin:0 0 10px}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.f .w{grid-column:1/-1}
label{display:grid;gap:2px;font-size:12.5px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:42px}
textarea{min-height:60px;resize:vertical}
input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--navy)}
label.ck{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}
:focus-visible{outline:2px solid #3b82f6;outline-offset:1px}
button{font:inherit;font-size:14px;font-weight:700;min-height:42px;padding:0 14px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
:root:not([data-theme=light]) button{border-color:#3d63c9}
button.g{background:transparent;color:var(--acc)}
button.s{min-height:34px;padding:0 10px;font-size:13px}
button.red{color:#d33;border-color:#d33;background:transparent}
.grp{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;display:grid;gap:8px}
.grp>.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.car{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.car.ed,.box.ed,.grp.ed{border:2px solid #16a34a;box-shadow:0 0 0 4px light-dark(#dcfce7,#14301d)}
.hd{display:flex;align-items:center;gap:10px}
.hd .ttl{flex:1;font-weight:700;font-size:14px}
.hd .mini{width:48px;height:36px;border-radius:4px;background:var(--line) center/cover no-repeat;flex:none}
button.ok2{background:#16a34a;border-color:#16a34a;color:#fff}
button.fin{width:100%;margin-top:10px;background:#16a34a;border-color:#16a34a;color:#fff;font-size:16px;min-height:48px}
.sum{color:var(--muted);font-size:14px}
.box>.hd h2{margin:0;flex:1}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs span{width:64px;height:48px;border-radius:4px;background:#ccc center/cover;position:relative}
.thumbs button{position:absolute;top:-6px;right:-6px;min-height:20px;width:20px;padding:0;border-radius:50%;font-size:12px;line-height:1}
.row{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted);margin:0}
#msg{font-size:13px;color:#1a9d4b;min-height:1.2em;margin:0;font-weight:600}
.pv{display:grid;gap:16px;justify-items:center;align-content:start;position:relative}
@media(min-width:981px){.pv{position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:4px 8px 40px;scroll-behavior:smooth}}
.pw.edit{outline:3px solid #16a34a;outline-offset:3px}
.pv.solo .pw:not(.cur){display:none}
.exporting .pv.solo .pw:not(.cur){display:block}
.pw{position:relative;box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:2px;overflow:hidden}
.pw>.page{transform-origin:0 0;position:absolute;left:0;top:0}
.exporting .pw{width:794px!important;height:1123px!important}
.exporting .pw>.page{transform:none!important}
#cover{position:fixed;inset:0;background:rgba(10,20,40,.75);color:#fff;display:none;place-items:center;z-index:50;font-size:20px;font-weight:700}
.exporting #cover{display:grid}

/* ===== A4 page (fixed, always light) ===== */
.page{width:794px;height:1123px;background:#fff;color:#14213d;overflow:hidden;font-family:Figtree,Arial,sans-serif;font-size:13px;line-height:1.4}
.page a{color:inherit;text-decoration:none}
.foot{position:absolute;left:44px;right:44px;bottom:24px;border-top:1px solid #e3e7ee;padding-top:11px;display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:#6b7686}
.foot b{color:#0b2a63}
.ch{height:170px;background:linear-gradient(115deg,#03132f 0%,#0a2a66 100%);color:#fff;display:flex;align-items:center;gap:34px;padding:0 44px}
.ch .lg{width:132px;flex:none}
.ch small{font-size:12px;font-weight:600;color:#b9c6e2}
.ch h1{font-size:24px;font-weight:800;margin:2px 0 12px;line-height:1.15}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.m3 div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:8px 9px;font-weight:700;font-size:12.5px}
.m3 span{display:block;font-size:9.5px;font-weight:500;color:#aab8d6;margin-bottom:3px}
.pb{position:absolute;left:44px;right:44px;top:186px;bottom:70px}
.pb.c2{top:80px}
.intro{background:#eaf7ec;color:#1d5f36;border-radius:7px;padding:11px 13px;font-size:12px;margin-bottom:14px}
.gh2{display:flex;gap:10px;align-items:flex-start;margin:6px 0 9px}
.num{width:22px;height:22px;border-radius:50%;background:#0b2a63;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:2px}
.gh2 b{display:block;font-size:15px;color:#0b2a63;font-weight:800}
.gh2>div>span{font-size:10.5px;color:#6b7686}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.card{border:1px solid #e1e6ee;border-radius:8px;overflow:hidden;background:#fff}
.ph{height:84px;background:#dfe5ee center/cover no-repeat;position:relative}
.ph .num{position:absolute;left:7px;top:7px;border:1.5px solid #fff}
.tag{position:absolute;left:6px;bottom:7px;background:#0b2a63;color:#fff;font-size:9.5px;font-weight:700;border-radius:4px;padding:3px 6px}
.cb{padding:8px 9px 9px}
.cb b{display:block;font-size:12px;font-weight:800;margin-bottom:3px}
.cb p{margin:0;font-size:10.5px;color:#6b7686}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pr strong{font-size:15px;color:#0b2a63;font-weight:800}
.sel{background:#22c55e;color:#fff!important;font-size:10.5px;font-weight:800;border-radius:5px;padding:6px 11px}
.dh{height:58px;background:#03132f;display:flex;align-items:center;justify-content:space-between;padding:0 44px;color:#c9d4ea;font-size:11.5px;font-weight:700}
.dh img{height:27px}
.dh .tt{color:#fff;font-size:15px;font-weight:800}
.dt{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:12px}
.chip{display:inline-block;background:#e4ebf8;color:#0b2a63;border-radius:99px;font-size:10.5px;font-weight:800;padding:4px 11px;margin-bottom:6px}
.dt h2{font-size:22px;margin:0;font-weight:800;line-height:1.15}
.dt p{margin:4px 0 0;font-size:11.5px;color:#6b7686}
.pbx{background:#0b2a63;color:#fff;border-radius:10px;padding:9px 18px;text-align:center;flex:none}
.pbx span{display:block;font-size:10px;color:#b9c6e2}
.pbx b{font-size:25px;font-weight:800;white-space:nowrap}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.st div{border:1px solid #e1e6ee;border-radius:8px;text-align:center;padding:8px 4px;font-size:15px;font-weight:800}
.st span{display:block;font-size:10px;font-weight:500;color:#6b7686;margin-bottom:2px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.pg div{height:188px;border-radius:5px;background:#dfe5ee center/cover no-repeat}
.pg.one div{grid-column:1/-1;height:330px;background-size:cover}
.lo{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:12px}
.lo h3{font-size:13px;color:#0b2a63;margin:0 0 6px;font-weight:800}
.sp{width:100%;border-collapse:collapse;font-size:11px}
.sp td{padding:6.5px 2px;border-bottom:1px dashed #dde2ea}
.sp td:last-child{text-align:right;font-weight:800}
.ins{background:#f2faf4;border:1px solid #d3ebd9;border-radius:8px;padding:10px 11px;font-size:10px;color:#6b7686}
.ins h3{margin-bottom:6px}
.shot{height:232px;background:#fff center/contain no-repeat;border-radius:6px;border:1px solid #e3e9e5}
.shot.no{display:grid;place-items:center;color:#9aa5b4;font-size:11px}
.lg2{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;margin-top:8px;font-family:'Noto Sans KR',Figtree,sans-serif;font-size:11px;font-weight:700;color:#222}
.lg2 span{display:flex;align-items:center;gap:4px}
.lg2 i{width:15px;height:15px;border-radius:50%;color:#fff;font-style:normal;font-family:Figtree,sans-serif;font-size:9px;font-weight:800;display:grid;place-items:center}
.dg{background:#fff;border-radius:6px;padding:6px;margin:6px 0}
.dg .lb{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-weight:800;color:#0b2a63;font-size:9.5px}
.dg .im{height:82px;background:center/contain no-repeat}
.dg .im.rep{height:205px}
.drop{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:8px;cursor:pointer;color:var(--ink);font-size:14px;font-weight:700}
.drop.w{grid-column:1/-1}
.drop .tn{width:72px;height:54px;border-radius:6px;background:var(--line) center/cover no-repeat;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.drop small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.drop input{display:none}
.drop.over,.drop.on{border-color:#16a34a;border-style:solid;background:light-dark(#effaf2,#13261a)}
.drop .lnk{font-size:12px;font-weight:600;color:var(--acc);text-decoration:underline;cursor:pointer;margin-right:10px}
.drop .on-t{display:none;color:#16a34a;font-weight:800}.drop.on .on-t{display:block}.drop.on .off-t{display:none}
.tip{background:light-dark(#effaf2,#13261a);border:1px solid #16a34a;border-radius:10px;padding:10px 12px;font-size:14px}
.tip b{color:#16a34a}
.ok{color:#15803d;font-weight:800;font-size:11px;margin:5px 0 2px;display:flex;align-items:center;gap:5px}
.ok i{width:14px;height:14px;border-radius:3px;background:#22c55e;color:#fff;font-style:normal;font-size:10px;display:grid;place-items:center}
.bad{color:#b45309;font-weight:800;font-size:11px;margin:5px 0 2px;white-space:pre-wrap}
.ec{color:#1d4ed8;font-weight:700;font-size:10px;margin:0 0 4px}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:8px}
.bt a{height:41px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px}
.bo{background:#f4a62a;color:#14213d}
.bg{background:#2bd468;color:#fff}
.chg{background:#f0f4fa;border-radius:8px;padding:7px 9px;display:flex;align-items:center;gap:7px;font-size:11px}
.chg b{color:#0b2a63;flex:none;padding-right:4px}
.chg a{flex:1;background:#fff;border:1px solid #dbe2ec;border-radius:6px;text-align:center;padding:6px 4px;font-weight:700}
.rq h2{font-size:24px;color:#0b2a63;margin:8px 0 4px;font-weight:800}
.rq>p{margin:0 0 16px;font-size:12.5px;color:#4b5565}
.s3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.s3 div{background:#f0f4fa;border-radius:8px;padding:11px;display:flex;gap:9px;align-items:center;font-weight:700;font-size:12px}
.big{height:46px;border-radius:9px;background:#2bd468;color:#fff!important;display:grid;place-items:center;font-weight:800;font-size:14px;margin-bottom:22px}
.rq h4{font-size:11px;color:#6b7686;margin:0 0 8px}
.bub{background:#dcf8c6;border-radius:10px;padding:13px 15px;width:76%;font-size:11.5px;line-height:2;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.bub b{display:block;line-height:1.5;margin-bottom:4px}
.empt{display:grid;place-items:center;height:100%;color:#8a95a5;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="ed">
    <div class="top"><h1>AutoMatch offer maker</h1><p>Fill in the cars and download the PDF. It comes out like your Bulgaria offer: a cover with all cars, one page per car, and a special-request page. Every button in the PDF opens WhatsApp.</p></div>
    <div class="bar">
      <button id="bUndo" class="g" disabled>↶ Undo</button>
      <button id="bPdf">Download PDF</button>
      <button id="bSave" class="g">Save draft</button>
      <button id="bOpen" class="g">Open draft</button>
      <button id="bNew" class="g red">New offer</button>
      <input type="file" id="fOpen" accept=".json,application/json" hidden>
    </div>
    <p id="msg" aria-live="polite"></p>
    <div id="editor"></div>
  </div>
  <div class="pv" id="pv"></div>
</div>
<div id="cover">Making PDF…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

function buildPages(){
  const pv=$('pv');pv.textContent='';
  const cars=allCars();
  const holder=document.createElement('div');holder.style.cssText='position:absolute;left:-9999px;top:0';document.body.append(holder);
  // cover pages: fit groups, overflow to continuation pages
  const covers=[];let cur=null;
  const mk=(first)=>{const p=document.createElement('div');p.className='page';p.style.position='relative';p.innerHTML=(first?coverHead():dhead('Price offer · continued'))+`<div class="pb${first?'':' c2'}">${first&&S.offer.intro?`<div class="intro">${esc(S.offer.intro)}</div>`:''}</div>`+foot();holder.append(p);covers.push(p);return p};
  cur=mk(true);
  // detail page index placeholder computed after cover count known: build twice
  const place=(firstDetail)=>{covers.forEach(p=>p.remove());covers.length=0;cur=mk(true);
    S.groups.forEach((g,gi)=>{const gc=cars.filter(x=>x.gi===gi);if(!gc.length&&!g.name)return;
      const body=cur.querySelector('.pb');const t=document.createElement('div');t.innerHTML=groupHTML(g,gi,gc,firstDetail);const node=t.firstElementChild;body.append(node);
      if(body.scrollHeight>body.clientHeight+1&&body.children.length>1){node.remove();cur=mk(false);cur.querySelector('.pb').append(node)}});
    return covers.length};
  let n=place(1);if(n!==1)place(n);coverN=covers.length;
  const pages=[...covers.map(p=>p.outerHTML),...cars.map(detailHTML)];
  if(S.offer.request)pages.push(requestHTML());
  holder.remove();
  pages.forEach(h=>{const w=document.createElement('div');w.className='pw';w.innerHTML=h;const p=w.firstElementChild;p.style.position='absolute';pv.append(w)});
  // fix internal data-page indices (0-based page index)
  pv.querySelectorAll('[data-page]').forEach(a=>{a.style.cursor='pointer'});
  scale();keepPage();
}

  if(a==='pdel'){get(b.dataset.c).photos.splice(+b.dataset.i,1)}
  renderEditor();buildPages();persist()});

function shrink(file,max,png){return new Promise(r=>{if(!file)return r('');const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',png?0.92:0.85))};im.onerror=()=>r('');im.src=fr.result};fr.readAsDataURL(file)})}

/* ---- top buttons ---- */
let dl=null;
const local={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:'saved'}}};
dl=local;
(async()=>{try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d)dl=d}}catch(e){}})();
async function give(name,data){try{await dl.save({filename:name,data});msg('Saved '+name);return true}catch(e){msg(e&&e.code==='declined'?'Download cancelled.':'Download did not work ('+(e&&e.code||'error')+').');return false}}
const fname=ext=>('AutoMatch_Offer_'+(S.offer.country||'')+'_'+(S.offer.date||'')).replace(/[^\w\-]+/g,'_').replace(/_+/g,'_').replace(/_$/,'')+'.'+ext;
$('bSave').addEventListener('click',()=>{if(dl)give(fname('json'),JSON.stringify(S))});
$('bUndo').addEventListener('click',undo);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&editing){e.preventDefault();finish()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){const t=document.activeElement;if(t&&(t.tagName==='INPUT'&&!['checkbox','file'].includes(t.type)||t.tagName==='TEXTAREA'))return;e.preventDefault();undo()}});
$('bOpen').addEventListener('click',()=>$('fOpen').click());
$('fOpen').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.groups||!d.offer)throw 0;snap();S=d;editing=null;renderEditor();buildPages();persist();msg('Draft opened.')}catch(x){msg('That file is not an offer draft.')}e.target.value=''});
$('bNew').addEventListener('click',e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to clear all cars';setTimeout(()=>{delete b.dataset.sure;b.textContent='New offer'},4000);return}
  snap();delete b.dataset.sure;b.textContent='New offer';const keep=Object.assign({},S.offer,{title:'',country:'',cur:'$',inc:'FOB',terms:'FOB · USD',date:new Date().toISOString().slice(0,10)});S={offer:keep,groups:[{name:'',sel:'',cars:[newCar()]}]};editing=null;target=null;renderEditor();buildPages();persist();msg('New offer started. Your contact details are kept.')});

$('bPdf').addEventListener('click',async()=>{
  if(!dl)return;if(!window.html2canvas||!window.jspdf){msg('PDF tools did not load. Reload the page.');return}
  document.documentElement.classList.add('exporting');
  try{
    await document.fonts.ready;
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
    const pages=[...$('pv').querySelectorAll('.page')];const k=210/794;
    for(let i=0;i<pages.length;i++){
      $('cover').textContent=`Making PDF… page ${i+1} of ${pages.length}`;
      const p=pages[i];const cv=await html2canvas(p,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,width:794,height:1123,windowWidth:1400});
      if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297,undefined,'FAST');
      const pr=p.getBoundingClientRect();
      p.querySelectorAll('a[href],a[data-page]').forEach(a=>{const r=a.getBoundingClientRect();if(!r.width)return;const x=(r.left-pr.left)*k,y=(r.top-pr.top)*k,w=r.width*k,h=r.height*k;
        if(a.dataset.page)pdf.link(x,y,w,h,{pageNumber:+a.dataset.page+1});else pdf.link(x,y,w,h,{url:a.getAttribute('href')})});
    }
    document.documentElement.classList.remove('exporting');scale();
    await give(fname('pdf'),pdf.output('blob'));
  }catch(e){msg('Could not make the PDF.');console.error(e)}
  finally{document.documentElement.classList.remove('exporting');scale()}
});

renderEditor();buildPages();
}
</script>
