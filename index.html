<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoMatch Korea – Car Request Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0d2240;--accent:#e4572e;--bg:#f4f6f9;--line:#d8dee8;--text:#1b2433;--muted:#667085;--green:#25d366}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Cairo,system-ui,sans-serif;font-size:15px;line-height:1.45}
  html[lang=ar] body{font-family:Cairo,Inter,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  header{background:var(--navy);color:#fff;border-radius:14px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:20px;letter-spacing:.3px}
  .brand span{color:var(--accent)}
  .sub{font-size:13px;opacity:.85;margin-top:2px}
  .langs{display:flex;gap:6px;flex-wrap:wrap}
  .langs button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  .langs button.on{background:#fff;color:var(--navy);font-weight:700}
  h1{font-size:19px;margin:20px 0 4px}
  .intro{color:var(--muted);margin:0 0 14px}
  form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
  .sec{font-weight:700;color:var(--navy);font-size:14px;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:inline-block}
  html[lang=ar] .sec{text-transform:none;letter-spacing:0}
  .sec:first-child{margin-top:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .full{grid-column:1/-1}
  label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
  label .req{color:var(--accent)}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fbfcfe;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);border-color:var(--navy)}
  textarea{min-height:80px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips label{font-weight:500;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:7px 12px;cursor:pointer;margin:0;background:#fbfcfe}
  .chips input{width:auto;margin:0}
  .chips label:has(input:checked){border-color:var(--navy);background:#e9eef6}
  .btn{display:block;width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  .err{color:#c0362c;font-size:13px;margin-top:10px;display:none}
  #result{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
  #result h2{font-size:17px;margin:0 0 8px}
  pre{white-space:pre-wrap;background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:14px;margin:0 0 12px;max-height:340px;overflow:auto}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions a,.actions button{display:flex;justify-content:center;align-items:center;gap:8px;padding:13px;border-radius:10px;font:inherit;font-weight:700;text-decoration:none;border:0;cursor:pointer}
  .wa{background:var(--green);color:#fff}
  .cp{background:#e9eef6;color:var(--navy)}
  .hint{color:var(--muted);font-size:12.5px;margin:6px 0 0;line-height:1.4}
  .note{color:var(--muted);font-size:13px;margin-top:10px}
  footer{text-align:center;color:var(--muted);font-size:13px;margin:18px 0 8px}
  footer b{color:var(--navy)}
  @media(max-width:560px){.grid,.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">AutoMatch <span>Korea</span></div>
      <div class="sub" data-t="tagline"></div>
    </div>
    <div class="langs">
      <button type="button" data-lang="ar">العربية</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="fr">Français</button>
      <button type="button" data-lang="es">Español</button>
      <button type="button" data-lang="bg">Български</button>
      <button type="button" data-lang="sq">Shqip</button>
    </div>
  </header>

  <h1 data-t="title"></h1>
  <p class="intro" data-t="intro"></p>

  <form id="f" novalidate>
    <div class="sec" data-t="s1"></div>
    <div class="grid">
      <div><label><span data-t="name"></span></label><input name="name"></div>
      <div><label data-t="company"></label><input name="company"></div>
      <div><label><span data-t="country"></span></label><input name="country"></div>
      <div><label data-t="phone"></label><input name="phone" type="tel" placeholder="+..."></div>
      <div class="full"><label><span data-t="buyer"></span></label><select name="buyer" id="buyer"></select></div>
    </div>

    <div class="sec" data-t="s2"></div>
    <div class="grid">
      <div class="full"><label><span data-t="type"></span></label>
        <div class="chips" id="types"></div></div>
      <div class="full"><label><span data-t="model"></span></label><input name="model" data-ph="modelPh"></div>
      <div><label data-t="yearFrom"></label><select name="yearFrom" class="years"></select></div>
      <div><label data-t="yearTo"></label><select name="yearTo" class="years"></select></div>
      <div><label data-t="kmFrom"></label><select name="kmFrom" class="kms"></select></div>
      <div><label data-t="kmTo"></label><select name="kmTo" class="kms"></select></div>
      <div><label data-t="qty"></label><input name="qty" type="number" min="1" value="1"></div>
      <div><label data-t="fuel"></label><select name="fuel" id="fuel"></select></div>
      <div><label data-t="gear"></label><select name="gear" id="gear"></select></div>
      <div><label data-t="color"></label><input name="color" data-ph="colorPh"></div>
      <div><label data-t="options"></label><input name="options" data-ph="optionsPh"></div>
      <div class="full"><label><span data-t="acc"></span></label><select name="acc" id="acc"></select>
        <input name="accOther" id="accOther" data-ph="accOtherPh" style="display:none;margin-top:8px"></div>
    </div>

    <div class="sec" data-t="s3"></div>
    <div class="grid">
      <div><label><span data-t="budget"></span></label><input name="budget" data-ph="budgetPh"></div>
      <div><label data-t="total"></label><input name="total" data-ph="totalPh"></div>
      <div><label data-t="port"></label><input name="port" data-ph="portPh"></div>
      <div class="full"><label data-t="ship"></label><select name="ship" id="ship"></select><p class="hint" data-t="shipHint"></p></div>
      <div><label data-t="when"></label><select name="when" id="when"></select></div>
      <div class="full"><label data-t="notes"></label><textarea name="notes" data-ph="notesPh"></textarea></div>
    </div>

    <button class="btn" type="submit" data-t="submit"></button>
    <div class="err" id="err" data-t="err"></div>
  </form>

  <div id="result">
    <h2 data-t="ready"></h2>
    <pre id="msg"></pre>
    <div class="actions">
      <a class="wa" id="wa" href="#" target="_blank" rel="noopener" data-t="sendWa"></a>
      <button class="cp" type="button" id="cp" data-t="copy"></button>
    </div>
    <p class="note" data-t="manual"></p>
  </div>

  <footer><b>Noor</b> · WhatsApp <b dir="ltr">+82 10-5189-9201</b> · automatchkorea.com</footer>
</div>

const KMS=[0,10000,20000,30000,50000,70000,100000,130000,150000,200000,250000,300000];
const f=document.getElementById('f');
let lang="ar";
function opts(sel,arr){const v=sel.selectedIndex;sel.innerHTML=arr.map((x,i)=>`<option value="${i}">${x}</option>`).join('');sel.selectedIndex=v<0?0:v;}
function setLang(l){
  lang=l;const t=L[l];
  document.documentElement.lang=l;document.documentElement.dir=t.dir;
  document.querySelectorAll('[data-t]').forEach(e=>{if(t[e.dataset.t]!==undefined)e.textContent=t[e.dataset.t]});
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t[e.dataset.ph]);
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  const checked=[...document.querySelectorAll('#types input:checked')].map(i=>i.value);
  document.getElementById('types').innerHTML=t.types.map((x,i)=>`<label><input type="checkbox" value="${i}" ${checked.includes(String(i))?'checked':''}> ${x}</label>`).join('');
  document.querySelectorAll('.kms').forEach(s=>{const v=s.value;let o=`<option value="">${t.any}</option>`;KMS.forEach(n=>o+=`<option value="${n}">${n.toLocaleString('en-US')} km</option>`);s.innerHTML=o;s.value=v;});opts(document.getElementById('fuel'),t.fuels);
  opts(document.getElementById('gear'),t.gears);opts(document.getElementById('ship'),t.ships);opts(document.getElementById('when'),t.whens);opts(document.getElementById('buyer'),t.buyers);opts(document.getElementById('acc'),t.accs);
  document.querySelectorAll('.years').forEach(s=>{const v=s.value;let h=`<option value="">${t.any}</option>`;for(let y=new Date().getFullYear();y>=2005;y--)h+=`<option>${y}</option>`;s.innerHTML=h;s.value=v;});
  if(document.getElementById('result').style.display==='block')build();
  try{localStorage.setItem('am_lang',l)}catch(e){}
}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
function build(){
  const t=L[L[lang].msgLang||lang],k=t.k,d=new FormData(f),g=n=>(d.get(n)||'').toString().trim();
  const types=[...document.querySelectorAll('#types input:checked')].map(i=>t.types[i.value]).join(', ');
  const yf=g('yearFrom'),yt=g('yearTo');
  const year=yf&&yt?`${yf} – ${yt}`:yf?`${yf}+`:yt?`≤ ${yt}`:t.any;
  const rows=[[k.name,g('name')],[k.company,g('company')],[k.country,g('country')],[k.phone,g('phone')],[k.buyer,g('buyer')>0?t.buyers[g('buyer')]:''],null,
   [k.type,types],[k.model,g('model')],[k.year,year],[k.km,(()=>{const a=g('kmFrom'),b=g('kmTo'),F=n=>Number(n).toLocaleString('en-US')+' km';return a&&b?F(a)+' – '+F(b):a?F(a)+' +':b?'≤ '+F(b):''})()],[k.qty,g('qty')],[k.fuel,t.fuels[g('fuel')]],[k.gear,t.gears[g('gear')]],[k.color,g('color')],[k.options,g('options')],[k.acc,g('acc')==='6'?(g('accOther')||t.accs[6]):g('acc')>0?t.accs[g('acc')]:''],null,
   [k.budget,g('budget')],[k.total,g('total')],[k.port,g('port')],[k.ship,t.ships[g('ship')]],[k.when,t.whens[g('when')]],[k.notes,g('notes')]];
  const txt="🚗 "+t.msgHead+"\n\n"+rows.filter(r=>r===null||r[1]).map(r=>r===null?"":`• ${r[0]}: ${r[1]}`).join("\n").replace(/\n{3,}/g,"\n\n").trim();
  document.getElementById('msg').textContent=txt;
  document.getElementById('wa').href=`https://wa.me/${PHONE}?text=${encodeURIComponent(txt)}`;
  return txt;
}
f.addEventListener('submit',e=>{
  e.preventDefault();
  const ok=[...f.elements].some(el=>(el.type==='checkbox'&&el.checked)||((el.tagName==='INPUT'&&el.type!=='checkbox'&&el.name!=='qty')||el.tagName==='TEXTAREA')&&el.value.trim()||(el.tagName==='SELECT'&&el.value&&el.value!=='0'));
  document.getElementById('err').style.display=ok?'none':'block';
  if(!ok)return;
  build();const r=document.getElementById('result');r.style.display='block';r.scrollIntoView({behavior:'smooth'});
});
document.getElementById('cp').onclick=async()=>{const b=document.getElementById('cp');try{await navigator.clipboard.writeText(document.getElementById('msg').textContent);b.textContent=L[lang].copied;setTimeout(()=>b.textContent=L[lang].copy,2000)}catch(e){const s=getSelection(),rg=document.createRange();rg.selectNodeContents(document.getElementById('msg'));s.removeAllRanges();s.addRange(rg);}};

function accToggle(){accO.style.display=accSel.value==='6'?'block':'none'}
accSel.addEventListener('change',accToggle);
